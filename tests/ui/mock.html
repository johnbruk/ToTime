<!doctype html><html lang="it"><head><meta charset="utf-8"/><base href="/"/><link rel="stylesheet" href="styles.css"/></head><body><div id="app"></div>
<script>
const profiles=[{id:'u1',user_id:'u1',first_name:'G',last_name:'B'}];
const clients=[{id:'c2',name:'Zeta',daily_rate:400,standard_hours:8,compensation_type:'daily_rate_8h',active:true},{id:'c1',name:'Equans',daily_rate:480,standard_hours:8,compensation_type:'daily_rate_8h',active:true}];
const projects=[{id:'p1',client_id:'c1',name:'Beta',active:true},{id:'p2',client_id:'c1',name:'Alfa',active:true}];
const activities=[{id:'a2',name:'Zulu',active:true},{id:'a1',name:'Alfa',active:true}];
const expense_categories=[{id:'x1',name:'Alfa',active:true,reimbursable:true}];
const STORES={
  timesheet_entries:[
    {id:'e1',entry_date:'2026-07-10',client_id:'c1',project_id:'p1',activity_id:'a1',hours:8,daily_rate_snapshot:480,standard_hours_snapshot:8},
    {id:'e2',entry_date:'2026-07-13',client_id:'c1',project_id:'p1',activity_id:'a1',hours:8,daily_rate_snapshot:480,standard_hours_snapshot:8},
    {id:'e3',entry_date:'2026-07-14',client_id:'c1',project_id:'p1',activity_id:'a1',hours:4,daily_rate_snapshot:480,standard_hours_snapshot:8},
    {id:'e3b',entry_date:'2026-07-14',client_id:'c1',project_id:'p1',activity_id:'a1',hours:4,description:'seconda voce',daily_rate_snapshot:480,standard_hours_snapshot:8},
    {id:'e7',entry_date:'2026-07-20',client_id:'c2',project_id:null,activity_id:'a2',hours:6,daily_rate_snapshot:400,standard_hours_snapshot:8},
    {id:'e9',entry_date:'2026-07-30',client_id:'c1',project_id:'p2',activity_id:'a1',hours:4,status:'planned',tm_batch_id:'tm_x',daily_rate_snapshot:480,standard_hours_snapshot:8}
  ],
  manual_entries:[],travel_expenses:[],trips:[],vehicles:[],monthly_compensations:[],
  app_settings:[{id:'s1',setting_key:'ferie_2026',setting_value:'["2026-07-06","2026-07-07"]'}],
  billing_headers:[],invoice_templates:[],tax_settings:[],tax_payments:[],
  clients,projects,activities,expense_categories,user_profiles:profiles
};
let seq=0;
function makeChain(table){
  let op='select',single=false,pl=null,inF=null,eqCol=null,eqVal=null;
  const rows=()=>(STORES[table]=STORES[table]||[]);
  const resolve=()=>{
    // Una tabella che il database non ha ancora: e' quello che vede chi
    // non ha lanciato la migrazione. Senza poterlo simulare, il ricadere
    // dell'app sul comportamento di prima non si prova mai.
    if((window.__tabelleMancanti||[]).includes(table))
      return {data:null,error:{code:'PGRST205',message:'Could not find the table \'public.'+table+'\' in the schema cache'}};
    // Una colonna che il database non ha ancora: e' quello che vede chi
    // non ha lanciato la migrazione. L'app deve togliere la colonna dal
    // payload e riprovare, e senza poterlo simulare quel ripiego non si
    // prova mai.
    const colonnaMancante=r=>{
      for(const c of (window.__colonneMancanti||[]))
        if(r&&Object.prototype.hasOwnProperty.call(r,c))
          return {data:null,error:{code:'PGRST204',message:"Could not find the '"+c+"' column of '"+table+"' in the schema cache"}};
      // Lo stesso guasto, ma con un messaggio che NON nomina la colonna.
      // Succede, e in quel caso l'app non puo' dedurre cosa togliere: se
      // la colonna non e' nell'elenco dropKeys, la scrittura muore.
      for(const c of (window.__colonneMancantiVaghe||[]))
        if(r&&Object.prototype.hasOwnProperty.call(r,c))
          return {data:null,error:{code:'PGRST204',message:'Could not find the column in the schema cache'}};
      return null;
    };
    if(op==='insert'){const arr=Array.isArray(pl)?pl:[pl];
      for(const r of arr){const e=colonnaMancante(r);if(e)return e;}
      // i vincoli veri del database, almeno quelli che l'app puo'
      // violare da sola: senza di loro il mock accetta tutto e i test
      // non vedono mai l'errore che vede la persona
      for(const r of arr){
        if(table==='tax_payments'&&window.__vietaPagamenti&&r.payment_type==='bollo')
          return {data:null,error:{message:'new row for relation "tax_payments" violates check constraint "tax_payments_payment_type_check"'}};
        if(table==='tax_payments'&&window.__rifiutaTutto)
          return {data:null,error:{message:'new row violates row-level security policy for table "tax_payments"'}};
        if(table==='wbs_items'&&window.__vietaWbs)
          return {data:null,error:{message:'new row violates row-level security policy for table "wbs_items"'}};
        if(table==='wbs_items'&&rows().some(x=>x.engagement_id===r.engagement_id&&String(x.activity_code)===String(r.activity_code)))
          return {data:null,error:{message:'duplicate key value violates unique constraint "wbs_items_engagement_activity_code_key"'}};
        if(table==='app_settings'&&rows().some(x=>x.setting_key===r.setting_key))
          return {data:null,error:{message:'duplicate key value violates unique constraint "app_settings_user_id_setting_key_key"'}};
      }
      const scritte=[];
      arr.forEach(r=>{const riga={id:'n'+(++seq),...r};rows().push(riga);scritte.push(riga);
        if(!window.__ins)window.__ins=[];window.__ins.push({__table:table,...r})});
      return {data:single?(scritte[0]||null):scritte,error:null};}
    if(op==='update'){const e=colonnaMancante(pl);if(e)return e;
      const i=rows().findIndex(r=>r.id===eqVal);if(i>=0)rows()[i]={...rows()[i],...pl};return {data:null,error:null};}
    if(op==='delete'){
      // Il vincolo severo, che e' quello che l'app puo' violare: una
      // trasferta ancora referenziata da una spesa non si cancella. Se
      // qui si mettesse un ON DELETE SET NULL gentile, il test non
      // proverebbe piu' che e' l'app a sganciare le spese.
      if(table==='trips'&&(STORES.travel_expenses||[]).some(e=>String(e.trip_id)===String(eqVal)))
        return {data:null,error:{message:'update or delete on table "trips" violates foreign key constraint "travel_expenses_trip_id_fkey" on table "travel_expenses"'}};
      if(inF)STORES[table]=rows().filter(r=>!inF.vals.includes(r[inF.col]));
      else if(eqCol)STORES[table]=rows().filter(r=>String(r[eqCol])!==String(eqVal));
      return {data:null,error:null};}
    return {data:single?(rows()[0]||null):rows().slice(),error:null};
  };
  const h={select(){if(op==='select')op='select';return proxy},order(){return proxy},eq(c,v){eqCol=c;eqVal=v;return proxy},in(c,v){inF={col:c,vals:v};return proxy},gte(){return proxy},lte(){return proxy},ilike(){return proxy},is(){return proxy},limit(){return proxy},insert(v){op='insert';pl=v;return proxy},update(v){op='update';pl=v;return proxy},delete(){op='delete';return proxy},single(){single=true;return proxy},maybeSingle(){single=true;return proxy}};
  const proxy=new Proxy({},{get(t,k){if(k==='then'){const p=Promise.resolve(resolve());return p.then.bind(p);}return h[k]||(()=>proxy);}});
  return proxy;
}
window.__stores=STORES;window.__ins=[];window.__tabelleMancanti=[];window.__colonneMancanti=[];window.__colonneMancantiVaghe=[];
window.supabase={createClient(){return {from(t){return makeChain(t);},auth:{async getSession(){return {data:{session:{user:{id:'u1'}}}};},onAuthStateChange(){return {data:{subscription:{unsubscribe(){}}}};}}};}};
</script><script type="module" src="app.js"></script></body></html>
